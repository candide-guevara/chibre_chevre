# Builds the Windows installer. Run it by hand: Actions tab > "Windows build" >
# Run workflow. The installer is published on the public GitHub Release
# v<pubspec version>, created or updated by the run, and is always at
# https://github.com/candide-guevara/chibre_chevre/releases/latest/download/chibre-setup.exe
name: Windows build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # to create the release and its tag
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Build
        run: flutter build windows --release

      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }

      - name: Package the installer
        id: package
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([\d.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" windows\installer\chibre.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Running it again for the same version replaces the installer.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Chibre Chèvre ${{ steps.package.outputs.version }}
          body: |
            Installateur Windows : téléchargez `chibre-setup.exe` et lancez-le.
            Windows peut afficher « Windows a protégé votre ordinateur » :
            cliquez sur « Informations complémentaires » puis « Exécuter quand même ».
          files: app/windows/installer/Output/chibre-setup.exe
          fail_on_unmatched_files: true
          make_latest: true
